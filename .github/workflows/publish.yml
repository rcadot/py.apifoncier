name: Publication PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  pypi:
    name: Publication sur PyPI
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # Publication par « Trusted Publishing » (OIDC) : aucun jeton PyPI stocké.
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - name: Construction
        run: uv build
      - name: Publication
        run: uv publish
